#################################
# Backend
#################################

backend = "glx";
vsync = true;

#################################
# Corners
#################################

corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'Rofi'",
    "class_g = 'dmenu'"
];

#################################
# Shadows
#################################

shadow = true;
shadow-radius = 18;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.22;

shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'Rofi'",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];

#################################
# Fading
#################################

fading = true;

fade-in-step = 0.04;
fade-out-step = 0.05;

fade-delta = 5;

#################################
# Transparency
#################################

inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 1.0;

inactive-opacity-override = false;

opacity-rule = [
    "100:class_g = 'Rofi'",
    "100:class_g = 'dmenu'",
    "100:class_g = 'Polybar'"
];

#################################
# Blur
#################################

blur:
{
    method = "dual_kawase";
    strength = 2;
    background = false;
    background-frame = false;
    background-fixed = false;
};

blur-background-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'Rofi'",
    "window_type = 'dock'"
];

#################################
# Animations
#################################

animations = true;

animation-window-mass = 0.8;
animation-stiffness = 260;
animation-dampening = 26;
animation-clamping = true;

animation-for-open-window = "zoom";
animation-for-unmap-window = "zoom";

animation-for-transient-window = "slide-down";

animation-for-workspace-switch-in = "slide-left";
animation-for-workspace-switch-out = "slide-right";

#################################
# Misc
#################################

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;

unredir-if-possible = false;

detect-transient = true;
detect-client-leader = true;

log-level = "warn";

wintypes:
{
    tooltip = { fade = true; shadow = false; opacity = 1.0; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 1.0; };
    dropdown_menu = { opacity = 1.0; };
};
